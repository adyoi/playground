name: Playground RDP (Twingate)

# ⚠️ WIP: workflow ini belum diverifikasi end-to-end di runner sungguhan.
# Twingate memakai model "client di 100.x + service key", BUKAN mesh VPN seperti ZeroTier.

on:
  workflow_dispatch:
    inputs:
      custom_password:
        description: 'Custom RDP password (optional, auto-generated if empty)'
        required: false
        type: string
      os:
        description: 'Runner OS image'
        required: true
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        default: 'windows-latest'

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 3600
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 📋 Display Configuration Info
        run: |
          Write-Host "🔧 === PLAYGROUND RDP - TWINGATE === 🔧"
          Write-Host "📦 Repository: ${{ github.repository }}"
          Write-Host "🆔 Run ID: ${{ github.run_id }}"
          Write-Host "👤 Triggered by: ${{ github.actor }}"
          Write-Host "===================================="

      - name: ⚙️ Configure Core RDP Settings
        run: |
          Write-Host "🔧 Mengaktifkan RDP & Firewall..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "AllowRemoteRPC" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Twingate" 2>nul
          netsh advfirewall firewall add rule name="RDP-Twingate" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP & Firewall configured"

      - name: 👤 Create RDP User
        id: create-user
        run: |
          Write-Host "👤 Creating RDP user..."
          $customPass = "${{ github.event.inputs.custom_password }}"
          if ($customPass -ne "") {
            $password = $customPass
          } else {
            Add-Type -AssemblyName System.Security
            $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57); Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)) }
            $rawPassword = @()
            $rawPassword += $charSet.Upper | Get-Random -Count 4
            $rawPassword += $charSet.Lower | Get-Random -Count 4
            $rawPassword += $charSet.Number | Get-Random -Count 4
            $rawPassword += $charSet.Special | Get-Random -Count 4
            $password = -join ($rawPassword | Sort-Object { Get-Random })
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -Force
          }
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_OUTPUT
          if (-not (Get-LocalUser -Name "RDP")) {
            Write-Error "❌ User creation failed"
            exit 1
          }
          Write-Host "✅ RDP user created with secure password"

      - name: 🔌 Install Twingate Client
        env:
          TWINGATE_SERVICE_KEY: ${{ secrets.TWINGATE_SERVICE_KEY }}
        run: |
          Write-Host "🔌 Downloading Twingate client (MSI)..."
          $ProgressPreference = 'SilentlyContinue'
          $msi = "$env:TEMP\twingate_client.msi"
          $url = "https://api.twingate.com/download/windows?installer=msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          $size = (Get-Item $msi).Length
          Write-Host "   downloaded: $size bytes"
          if ($size -lt 1000000) {
            Write-Error "❌ File MSI terlalu kecil ($size bytes) - URL mungkin tidak valid."
            exit 1
          }

          if ($env:TWINGATE_SERVICE_KEY) {
            Write-Host "🔑 Service key ditemukan -> install headless (service_secret)."
            $keyPath = "$env:TEMP\twingate_service_key.json"
            [System.IO.File]::WriteAllText($keyPath, $env:TWINGATE_SERVICE_KEY)
            try {
              # Sintaks resmi Twingate: service_secret=<path> (tanpa quote tambahan)
              $msiArgs = "/i `"$msi`" /l*v `"$env:TEMP\twingate_install.log`" log_level=debug service_secret=$keyPath /quiet"
              Write-Host "   msiexec args: $msiArgs"
              $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList $msiArgs
              Write-Host "   msiexec exit code: $($p.ExitCode)"
            } finally {
              Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Warning "⚠️ Secret TWINGATE_SERVICE_KEY kosong -> install tanpa headless (client tidak akan online)."
            Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /quiet"
          }
          # Service mungkin butuhbeat_ms untuk register setelah install
          for ($i = 0; $i -lt 30; $i++) {
            if (Get-Service -Name "twingate.service" -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Seconds 2
          }
          $svcCheck = Get-Service -Name "twingate.service" -ErrorAction SilentlyContinue
          if (-not $svcCheck) {
            Write-Error "❌ Service twingate.service tidak terdaftar setelah install."
            Write-Host "   Log install: $env:TEMP\twingate_install.log"
            if (Test-Path "$env:TEMP\twingate_install.log") { Get-Content "$env:TEMP\twingate_install.log" -Tail 25 | ForEach-Object { Write-Host "   $_" } }
            exit 1
          }
          Write-Host "✅ Twingate client installed (service: $($svcCheck.Status))"

      - name: 🔗 Establish Twingate Connection
        run: |
          Write-Host "🔗 Starting Twingate service..."
          Write-Host "🔗 Starting Twingate service (dengan retry)..."
          $maxRetries = 5
          $wait = 5
          $started = $false
          for ($r = 0; $r -lt $maxRetries; $r++) {
            try {
              $svc = Get-Service -Name "twingate.service" -ErrorAction Stop
              if ($svc.Status -eq 'Stopped') { Start-Service -Name "twingate.service" -ErrorAction Stop }
              Start-Sleep -Seconds $wait
              $svc = Get-Service -Name "twingate.service" -ErrorAction Stop
              if ($svc.Status -eq 'Running') {
                Write-Host "✅ Service running (try $($r+1))."
                $started = $true
                break
              }
            } catch {
              Write-Host "⚠️ Try $($r+1) gagal: $_"
            }
            $wait += 5
          }
          if (-not $started) {
            Write-Error "❌ Twingate service gagal start setelah $maxRetries retries. Cek log install C:\ProgramData\Twingate\logs"
            exit 1
          }

          Write-Host "⏳ Menunggu IP Twingate (100.x) - maks 5 menit..."
          $tgIP = $null
          for ($i = 0; $i -lt 60; $i++) {
            $addr = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
              Where-Object { $_.IPAddress -like '100.*' } |
              Select-Object -First 1
            if ($addr) { $tgIP = $addr.IPAddress; break }
            Start-Sleep -Seconds 5
          }

          if (-not $tgIP) {
            Write-Error "❌ Runner belum dapat IP Twingate (100.x) setelah 5 menit."
            Write-Host "   Penyebab: TWINGATE_SERVICE_KEY kosong/tidak valid, atau service belum online."
            Write-Host "   Cek log client: C:\ProgramData\Twingate\logs"
            exit 1
          }
          Write-Host "🌐 Twingate IP: $tgIP"
          echo "TWINGATE_IP=$tgIP" >> $env:GITHUB_ENV

      - name: ✅ Verify RDP Connectivity
        run: |
          Write-Host "🔍 Verifying RDP connectivity..."
          Write-Host "🌐 Twingate IP: $env:TWINGATE_IP"
          $test = Test-NetConnection -ComputerName $env:TWINGATE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $test.TcpTestSucceeded) {
            Write-Error "❌ TCP ke $env:TWINGATE_IP:3389 gagal"
            exit 1
          }
          Write-Host "✅ TCP connectivity successful!"

      - name: 📋 Display RDP Access Info
        run: |
          Write-Host "`n🎯 === RDP ACCESS INFO (TWINGATE) === 🎯"
          Write-Host "💻 Computer: $env:TWINGATE_IP"
          Write-Host "👤 Username: RDP"
          Write-Host "🔑 Password: ${{ steps.create-user.outputs.RDP_PASSWORD }}"
          Write-Host "==============================="
          Write-Host "📱 Cara Menyambung: PC Anda harus login ke Twingate client dengan network yang sama"
          Write-Host "   (Twingate app di PC -> login -> resource 100.x:3389)"
          Write-Host "=====================================`n"

          # Loop keepalive: 355 menit (~5h55m) agar client tetap online
          $totalMinutes = 355
          for ($i = 0; $i -lt $totalMinutes; $i++) {
            Write-Host "🟢 [$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active via Twingate ($env:TWINGATE_IP)"
            Start-Sleep -Seconds 60
          }

      - name: 🧹 Cleanup on Cancel/Failure
        if: cancelled() || failure()
        run: |
          Write-Host "🧹 Cleaning up Twingate..."
          $svc = Get-Service -Name "twingate.service" -ErrorAction SilentlyContinue
          if ($svc) {
            try {
              Stop-Service -Name "twingate.service" -Force -ErrorAction Stop
              Write-Host "✅ Twingate service stopped"
            } catch {
              Write-Warning "⚠️ Gagal stop service: $_"
            }
          } else {
            Write-Host "ℹ️ Service twingate.service tidak ada."
          }
          Write-Host "✅ Cleanup completed"
