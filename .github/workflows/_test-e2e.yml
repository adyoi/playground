name: TEST e2e (setup-rdp + setup-ngrok)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OS image'
        required: true
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        default: 'windows-latest'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 8
    steps:
      - name: 📜 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Remote Access
        id: access
        uses: ./.github/actions/setup-rdp
        with:
          username: RDP
          custom_password: ''
          firewall_rule: RDP-E2E

      - name: 🔗 Install & Run Ngrok
        id: tunnel
        uses: ./.github/actions/setup-ngrok
        with:
          port: ${{ steps.access.outputs.port }}
          token: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: 📋 Display RDP Access Info
        shell: bash
        env:
          PROTOCOL: ${{ steps.access.outputs.protocol }}
          PORT: ${{ steps.access.outputs.port }}
          PUBLIC_URL: ${{ steps.tunnel.outputs.public_url }}
          USERNAME: ${{ steps.access.outputs.username }}
          PASSWORD: ${{ steps.access.outputs.password }}
        run: |
          echo ""
          echo "🎯 === RDP ACCESS INFO (E2E TEST) === 🎯"
          echo "💻 Computer: ${PUBLIC_URL}"
          echo "👤 Username: ${USERNAME}"
          echo "🔑 Password: ${PASSWORD}"
          echo "🔌 Protocol: ${PROTOCOL}  Port: ${PORT}"
          echo "==============================="
          echo "E2E_OK"