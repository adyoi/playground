name: Playground RDP Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure Core RDP Settings
        run: |
          # Mengaktifkan fitur Remote Desktop (RDP) di Windows
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force

          # Allow multiple RDP sessions
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "AllowRemoteRPC" -Value 1 -Force

          # Membuka port 3389 di Firewall Windows
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>nul
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Memuat ulang layanan Remote Desktop
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        id: create-user
        run: |
          # Membuat password acak yang kuat & aman
          Add-Type -AssemblyName System.Security
          $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57); Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)) }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -Force
          }

          # Mendaftarkan user ke grup Administrator & RDP
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Menyimpan output password agar bisa dipanggil nanti
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_OUTPUT

      - name: Install Tailscale
        run: |
          Write-Host "Menginstal Tailscale via official script..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $script = Invoke-WebRequest -Uri "https://tailscale.com/install.ps1" -UseBasicParsing
          Invoke-Expression $script.Content
          
          # Tambahkan Tailscale ke PATH untuk step selanjutnya
          $env:PATH += ";C:\Program Files\Tailscale"
          echo "C:\Program Files\Tailscale" >> $env:GITHUB_PATH

      - name: Start Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Error "TAILSCALE_AUTH_KEY tidak ditemukan di GitHub Secrets."
            exit 1
          }
          
          Write-Host "Memulai Tailscale..."
          tailscale up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=github-runner-$env:GITHUB_RUN_ID --accept-routes
          
          # Tunggu koneksi stabil
          Start-Sleep -Seconds 10
          
          # Dapatkan IP Tailscale
          $tailscaleIP = tailscale ip -4
          Write-Host "Tailscale IP: $tailscaleIP"
          echo "TAILSCALE_IP=$tailscaleIP" >> $env:GITHUB_ENV

      - name: Verify RDP Connectivity
        run: |
          # Verifikasi apakah port RDP lokal merespons
          $testResult = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Display RDP Access Info
        run: |
          Write-Host "`n=== RDP ACCESS INFO (TAILSCALE) ==="
          Write-Host "Username: RDP"
          Write-Host "Password: ${{ steps.create-user.outputs.RDP_PASSWORD }}"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "======================`n"
          Write-Host "Cara Menyambung Dari Laptop Anda:"
          Write-Host "1. Install Tailscale di laptop lokal: https://tailscale.com/download"
          Write-Host "2. Login ke akun Tailscale yang sama (atau tailnet yang sama)"
          Write-Host "3. Buka Remote Desktop Connection, ketik komputer tujuan:"
          Write-Host "   $env:TAILSCALE_IP:3389"
          Write-Host "4. Masukkan username: RDP dan password di atas"
          Write-Host "======================`n"

          $totalMinutes = 340
          for ($i = 0; $i -lt $totalMinutes; $i++) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active via Tailscale ($env:TAILSCALE_IP)"
            Start-Sleep -Seconds 60
          }