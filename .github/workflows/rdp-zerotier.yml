name: Playground RDP (ZeroTier)

on:
  workflow_dispatch:
    inputs:
      network_id:
        description: 'ZeroTier Network ID (16 hex chars, from my.zerotier.com)'
        required: true
        type: string
      custom_password:
        description: 'Custom RDP password (optional, auto-generated if empty)'
        required: false
        type: string
      os:
        description: 'Runner OS image'
        required: true
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        default: 'windows-latest'

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 350
    steps:
      - name: 📋 Display Configuration Info
        shell: bash
        run: |
          echo "🔧 === PLAYGROUND RDP - ZEROTIER === 🔧"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🆔 Run ID: ${{ github.run_id }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🖥️  Runner OS: ${RUNNER_OS}"
          echo "🪐 Network: ${{ github.event.inputs.network_id }}"
          echo "=================================="

      - name: 📜 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Remote Access
        id: access
        uses: ./.github/actions/setup-rdp
        with:
          username: RDP
          custom_password: ${{ github.event.inputs.custom_password }}
          firewall_rule: RDP-ZeroTier

      - name: 🪐 Install & Join ZeroTier
        id: vpn
        uses: ./.github/actions/setup-zerotier
        with:
          network_id: ${{ github.event.inputs.network_id }}

      - name: ✅ Verify Connectivity
        shell: bash
        env:
          PORT: ${{ steps.access.outputs.port }}
        run: |
          echo "🔍 Verifikasi port ${PORT} di runner..."
          python3 -c "import socket,sys; s=socket.socket(); s.settimeout(5); sys.exit(0 if s.connect_ex(('127.0.0.1', int(sys.argv[1]))) == 0 else 1)" "$PORT" || {
            echo "❌ Port ${PORT} tidak merespons di runner" >&2
            exit 1
          }
          echo "✅ Port ${PORT} aktif"

      - name: 📋 Display RDP Access Info
        shell: bash
        env:
          PROTOCOL: ${{ steps.access.outputs.protocol }}
          PORT: ${{ steps.access.outputs.port }}
          VPN_IP: ${{ steps.vpn.outputs.ip }}
          USERNAME: ${{ steps.access.outputs.username }}
          PASSWORD: ${{ steps.access.outputs.password }}
          SSH_KEY: ${{ steps.access.outputs.ssh_private_key }}
        run: |
          echo ""
          echo "🎯 === RDP ACCESS INFO (ZEROTIER) === 🎯"
          echo "💻 Computer: ${VPN_IP}:${PORT}"
          echo "👤 Username: ${USERNAME}"
          if [ "$PROTOCOL" = "ssh" ]; then
            echo "🔑 Auth: SSH key (lihat di bawah)"
            echo ""
            echo "🔐 PRIVATE KEY - simpan aman, hapus log run setelah dipakai:"
            echo "${SSH_KEY}"
          else
            echo "🔑 Password: ${PASSWORD}"
          fi
          echo "================================="
          echo "📱 Cara Menyambung dari Devices Anda:"
          echo "1️⃣ Install ZeroTier: https://www.zerotier.com/download/"
          echo "2️⃣ Login ke akun ZeroTier yang memiliki network ${{ github.event.inputs.network_id }}"
          echo "3️⃣ Tunggu status Connected di ZeroTier client"
          echo "4️⃣ Buka Remote Desktop Connection (mstsc) -> ${VPN_IP}:${PORT}"
          echo "===================================== "
          echo ""

          for i in $(seq 1 340); do
            echo "🟢 [$(date '+%Y-%m-%d %H:%M:%S')] Remote access active via ZeroTier"
            sleep 60
          done

      - name: 🧹 Cleanup on Cancel/Failure
        if: cancelled() || failure()
        shell: bash
        run: |
          echo "🧹 Cleaning up ZeroTier..."
          ZT=""
          for candidate in \
            "/c/Program Files (x86)/ZeroTier/One/zerotier-cli.exe" \
            "/c/Program Files/ZeroTier/One/zerotier-cli.exe" \
            "/Library/Application Support/ZeroTier/One/zerotier-cli" \
            "/var/lib/zerotier-one/zerotier-cli"; do
            [ -x "$candidate" ] && { ZT="$candidate"; break; }
          done
          [ -n "$ZT" ] && sudo "$ZT" leave "${{ github.event.inputs.network_id }}" 2>/dev/null || true
          echo "✅ Cleanup completed"