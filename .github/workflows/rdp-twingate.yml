name: Playground RDP (Twingate)

on:
  workflow_dispatch:
    inputs:
      custom_password:
        description: 'Custom RDP password (optional, auto-generated if empty)'
        required: false
        type: string
      os:
        description: 'Runner OS image'
        required: true
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        default: 'windows-latest'
      twt_token:
        description: 'ZeroTier API token (for Twingate auto-auth)'
        required: false
        type: string
      os_tunnel:
        description: 'ZeroTier network ID for Twingate to authorize'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 3600
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 📋 Display Configuration Info
        run: |
          Write-Host "🔧 === PLAYGROUND RDP - TWINGATE === 🔧"
          Write-Host "📦 Repository: ${{ github.repository }}"
          Write-Host "🆔 Run ID: ${{ github.run_id }}"
          Write-Host "👤 Triggered by: ${{ github.actor }}"
          Write-Host "===================================="

      - name: ⚙️ Configure Core RDP Settings
        run: |
          Write-Host "🔧 Mengaktifkan RDP & Firewall..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "AllowRemoteRPC" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Twingate" 2>nul
          netsh advfirewall firewall add rule name="RDP-Twingate" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP & Firewall configured"

      - name: 👤 Create RDP User
        id: create-user
        run: |
          Write-Host "👤 Creating RDP user..."
          $customPass = "${{ github.event.inputs.custom_password }}"
          if ($customPass -ne "") {
            $password = $customPass
          } else {
            Add-Type -AssemblyName System.Security
            $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57); Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)) }
            $rawPassword = @()
            $rawPassword += $charSet.Upper | Get-Random -Count 4
            $rawPassword += $charSet.Lower | Get-Random -Count 4
            $rawPassword += $charSet.Number | Get-Random -Count 4
            $rawPassword += $charSet.Special | Get-Random -Count 4
            $password = -join ($rawPassword | Sort-Object { Get-Random })
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -Force
          }
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_OUTPUT
          if (-not (Get-LocalUser -Name "RDP")) {
            Write-Error "❌ User creation failed"
            exit 1
          }
          Write-Host "✅ RDP user created with secure password"

      - name: 🔌 Install Twingate
        env:
          TWINGATE_VERSION: "2.2.0"
        run: |
          Write-Host "🔌 Installing Twingate..."
          $installer = "$env:TEMP\TwingateInstaller.exe"
          Invoke-WebRequest -Uri "https://github.com/Adyoi/playground/releases/download/v2.2.0/twingate-windows-x64.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          Write-Host "✅ Twingate installed"

      - name: 🔗 Establish Twingate Connection
        env:
          ZEROTIER_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
          ZEROTIER_API_TOKEN: ${{ secrets.ZEROTIER_API_TOKEN }}
        run: |
          Write-Host "🔗 Joining network $env:ZEROTIER_NETWORK_ID with Twingate..."
          $ztCli = @(
            "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat",
            "C:\Program Files\ZeroTier\One\zerotier-cli.bat",
            "C:\Program Files\ZeroTier\One\zerotier-cli.exe",
            "C:\Program Files\ZeroTier\One\zerotier-cli.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          
          if (-not $ztCli) {
            Write-Error "❌ zerotier-cli tidak ditemukan setelah install."
            exit 1
          }
          
          # Join network
          & $ztCli join $env:ZEROTIER_NETWORK_ID 2>&1
          Write-Host "✅ Joined network $env:ZEROTIER_NETWORK_ID"
          
          # Authenticate node via ZeroTier Central API (if token provided)
          if ($env:ZEROTIER_API_TOKEN) {
            Write-Host "🔑 Using ZEROTIER_API_TOKEN for auto-auth"
            $nodeId = (& $ztCli info 2>&1 | Select-Object -First 1) -split '\s+' | Select-Object -Index 2
            $authUrl = "https://api.zerotier.com/api/v1/network/$env:ZEROTIER_NETWORK_ID/member/$nodeId"
            try {
              $response = Invoke-RestMethod -Uri $url -Headers @{Authorization="token $env:ZEROTIER_API_TOKEN"} -Method Post -Body '{"config":{"authorized":true}}'
              Write-Host "✅ Node $nodeId auto-authorized via API"
            } catch {
              Write-Warning "⚠️ Auto-auth failed: $_"
            }
          } else {
            Write-Host "ℹ️ Tanpa token -> otorisasi manual di dashboard."
          }
          
          # Print Node ID for manual Auth step
          $nodeId = (& $ztCli info 2>&1 | Select-Object -First 1) -split '\s+' | Select-Object -Index 2
          Write-Host "⏳ Menunggu IP ZeroTier (maks 10 menit)..."
          Write-Host "   Node ID runner : $nodeId"
          Write-Host "   Network Private? Authorize node di atas di:"
          Write-Host "   https://my.zerotier.com -> Networks -> $env:ZEROTIER_NETWORK_ID -> Members -> centang 'Auth'"
          
          # Tunggu sampai dapat IP
          $ztIP = $null
          $retries = 0
          $maxRetries = 120
          while (-not $ztIP -and $retries -lt $maxRetries) {
            $nets = $null
            try {
              $nets = (& $ztCli -j listnetworks 2>$null | Out-String) | ConvertFrom-Json
            } catch { $nets = $null }
            $net = $nets | Where-Object { $_.nwid -eq $env:ZEROTIER_NETWORK_ID } | Select-Object -First 1
            if ($net) {
              $addr = $net.assignedAddresses | Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+/' -and $_ -notmatch '^999\.' } |
                Select-Object -First 1
              if ($addr) { $ztIP = ($addr -split '/')[0] }
            }
            if ($ztIP) { break }
            Start-Sleep -Seconds 5
            $retries++
          }
          
          if ($ztIP) {
            Write-Host "✅ ZeroTier IP: $ztIP"
            echo "ZEROTIER_IP=$ztIP" >> $env:GITHUB_ENV
            Write-Host "🌐 ZeroTier IP: $ztIP"
          } else {
            Write-Error "❌ Node belum dapat IP ZeroTier setelah 10 menit."
            Write-Host "   Penyebab paling umum: network Access type = Private, node belum di-authorize."
            Write-Host "   1. Buka https://my.zerotier.com -> Networks -> $env:ZEROTIER_NETWORK_ID -> Members"
            Write-Host "   2. Cari node $nodeId, centang 'Auth'"
            Write-Host "   3. Jalankan ulang workflow ini"
            exit 1
          }