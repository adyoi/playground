name: Playground RDP (ZeroTier)

on:
  workflow_dispatch:
    inputs:
      network_id:
        description: 'ZeroTier Network ID - leave empty to use the ZEROTIER_NETWORK_ID secret'
        required: false
        type: string
        default: ''
      custom_password:
        description: 'Custom RDP password (optional, auto-generated if empty)'
        required: false
        type: string
      os:
        description: 'Runner OS image'
        required: true
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        default: 'windows-latest'
      protocol:
        description: 'Remote access protocol. auto = RDP on Windows/Linux, SSH on macOS'
        required: false
        type: choice
        options:
          - auto
          - rdp
          - ssh
        default: 'auto'
      keepalive_minutes:
        description: 'How long to keep the session alive (max 340)'
        required: false
        type: string
        default: '340'

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 350
    env:
      # Resolve the network id once: a manual input wins, otherwise fall back to the
      # secret. Every step then reads ZT_NETWORK so cleanup leaves the right network.
      ZT_NETWORK: ${{ github.event.inputs.network_id != '' && github.event.inputs.network_id || secrets.ZEROTIER_NETWORK_ID }}
    steps:
      - name: 📋 Display Configuration Info
        shell: bash
        run: |
          echo "🔧 === PLAYGROUND RDP - ZEROTIER === 🔧"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🆔 Run ID: ${{ github.run_id }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🖥️  Runner OS: ${RUNNER_OS}"
          echo "🪐 Network: ${ZT_NETWORK}"
          echo "=================================="

      - name: 📜 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Remote Access
        id: access
        uses: ./.github/actions/setup-rdp
        with:
          username: RDP
          custom_password: ${{ github.event.inputs.custom_password }}
          firewall_rule: RDP-ZeroTier
          protocol: ${{ github.event.inputs.protocol }}

      - name: 🪐 Install & Join ZeroTier
        id: vpn
        uses: ./.github/actions/setup-zerotier
        with:
          network_id: ${{ env.ZT_NETWORK }}

      - name: ✅ Verify Connectivity
        shell: bash
        env:
          PORT: ${{ steps.access.outputs.port }}
        run: |
          echo "🔍 Verifikasi port ${PORT} di runner..."
          # Portabel: bash /dev/tcp jalan di Git Bash, Linux, dan macOS.
          # Fallback ke python hanya kalau shell-nya tidak punya /dev/tcp.
          port_open() {
            if (exec 3<>"/dev/tcp/127.0.0.1/$1") 2>/dev/null; then
              return 0
            fi
            local py=""
            command -v python3 >/dev/null 2>&1 && py="python3"
            [ -z "$py" ] && command -v python >/dev/null 2>&1 && py="python"
            if [ -n "$py" ]; then
              "$py" -c "import socket,sys; s=socket.socket(); s.settimeout(5); sys.exit(0 if s.connect_ex(('127.0.0.1', int(sys.argv[1]))) == 0 else 1)" "$1" && return 0
            fi
            return 1
          }
          if ! port_open "$PORT"; then
            echo "❌ Port ${PORT} tidak merespons di runner" >&2
            exit 1
          fi
          echo "✅ Port ${PORT} aktif"

      - name: 📋 Display RDP Access Info
        shell: bash
        env:
          PROTOCOL: ${{ steps.access.outputs.protocol }}
          PORT: ${{ steps.access.outputs.port }}
          VPN_IP: ${{ steps.vpn.outputs.ip }}
          USERNAME: ${{ steps.access.outputs.username }}
          PASSWORD: ${{ steps.access.outputs.password }}
          SSH_KEY: ${{ steps.access.outputs.ssh_private_key }}
          KEEPALIVE_MINUTES: ${{ github.event.inputs.keepalive_minutes }}
        run: |
          echo ""
          echo "🎯 === REMOTE ACCESS INFO (ZEROTIER) === 🎯"
          echo "💻 Computer: ${VPN_IP}:${PORT}"
          if [ "$PROTOCOL" = "ssh" ]; then
            echo "👤 Username: runner  (user bawaan runner, bukan user RDP)"
            echo "🔑 Auth: SSH private key"
            echo ""
            echo "   Contoh: ssh -i playground_key -p ${PORT} runner@${VPN_IP}"
            echo ""
            echo "🔐 PRIVATE KEY - simpan aman, hapus log run setelah dipakai:"
            echo "${SSH_KEY}"
          else
            echo "👤 Username: ${USERNAME}"
            echo "🔑 Password: ${PASSWORD}"
          fi
          echo "================================="
          echo "📱 Cara Menyambung dari Devices Anda:"
          echo "1️⃣ Install ZeroTier: https://www.zerotier.com/download/"
          echo "2️⃣ Join Network di app ZeroTier, lalu Authorize device di my.zerotier.com"
          if [ "$PROTOCOL" = "ssh" ]; then
            echo "3️⃣ Buka terminal: ssh -i <file-private-key> -p ${PORT} runner@${VPN_IP}"
          else
            echo "3️⃣ Buka Remote Desktop Connection (mstsc), masukan info di atas"
          fi
          echo "====================================="
          echo ""

          # Clamp so a typo (or 0) cannot make the loop exit instantly or blow
          # past the job timeout.
          MINUTES="${KEEPALIVE_MINUTES:-340}"
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=340 ;; esac
          [ "$MINUTES" -gt 340 ] && MINUTES=340
          [ "$MINUTES" -lt 1 ] && MINUTES=1
          echo "⏱️  Holding the session for ${MINUTES} minutes"

          for i in $(seq 1 "$MINUTES"); do
            echo "🟢 [$(date '+%Y-%m-%d %H:%M:%S')] Remote access active via ZeroTier ($i/${MINUTES})"
            sleep 60
          done
          echo "⏹️  Keepalive selesai. Menutup sesi."

      - name: 🧹 Cleanup on Cancel/Failure
        if: cancelled() || failure()
        shell: bash
        run: |
          echo "🧹 Cleaning up ZeroTier..."
          ZT=""
          for candidate in \
            "/c/Program Files (x86)/ZeroTier/One/zerotier-cli.exe" \
            "/c/Program Files/ZeroTier/One/zerotier-cli.exe" \
            "/Library/Application Support/ZeroTier/One/zerotier-cli" \
            "/var/lib/zerotier-one/zerotier-cli"; do
            [ -x "$candidate" ] && { ZT="$candidate"; break; }
          done
          [ -n "$ZT" ] && sudo "$ZT" leave "${ZT_NETWORK}" 2>/dev/null || true
          echo "✅ Cleanup completed"