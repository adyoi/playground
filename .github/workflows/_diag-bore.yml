name: DIAG bore connectivity

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'bore server host'
        required: false
        default: 'bore.pub'

jobs:
  diag:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Raw socket probe
        shell: bash
        env:
          HOST: ${{ inputs.host }}
        run: |
          echo "### RUNNER_OS=${RUNNER_OS}"
          echo "### TEST 1: connect only, no send. Expect recv to time out or return bytes."
          python3 -c "import socket,sys; a=socket.gethostbyname(sys.argv[1]); print('resolved',a); s=socket.socket(); s.settimeout(12); s.connect((a,7835)); print('TCP connect OK'); d=s.recv(256); print('recv bytes',len(d),repr(d[:100]))" "$HOST" || echo "TEST1 exited non-zero (see traceback above)"
          echo
          echo "### TEST 2: connect, send 6 bytes, then read."
          python3 -c "import socket,sys; a=socket.gethostbyname(sys.argv[1]); s=socket.socket(); s.settimeout(12); s.connect((a,7835)); s.sendall(b'hello\n'); print('sent'); d=s.recv(256); print('recv bytes',len(d),repr(d[:100]))" "$HOST" || echo "TEST2 exited non-zero (see traceback above)"
          echo
          echo "### TEST 3: connect to a well-known control port for comparison (no idea.cloudflare.com:443)"
          python3 -c "import socket,sys; a=socket.gethostbyname('one.one.one.one'); s=socket.socket(); s.settimeout(12); s.connect((a,443)); print('baseline TCP 443 OK')" || echo "baseline failed"

      - name: Run bore hostname vs IP
        shell: bash
        env:
          HOST: ${{ inputs.host }}
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/bore"; mkdir -p "$W"
          A=$(uname -m)
          case "$A" in x86_64|amd64) A=amd64;; aarch64|arm64) A=arm64;; *) A=amd64;; esac
          if [ "${RUNNER_OS}" = "Windows" ]; then
            curl -fsSL -o "$W/b.zip" "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-${A}-pc-windows-msvc.zip"
            unzip -o -q "$W/b.zip" -d "$W"; BIN="$W/bore.exe"
          else
            curl -fsSL -o "$W/b.tgz" "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-${A}-unknown-linux-musl.tar.gz"
            tar -xzf "$W/b.tgz" -C "$W"; BIN="$W/bore"
          fi
          chmod +x "$BIN"

          echo "### bore --to $HOST (hostname)"
          "$BIN" local 3389 --to "$HOST" >"$W/h.log" 2>&1 &
          P=$!; sleep 12
          if kill -0 $P 2>/dev/null; then echo "RESULT hostname: STILL RUNNING (OK)"; kill $P 2>/dev/null; else echo "RESULT hostname: DIED"; fi
          sed 's/\x1b\[[0-9;]*m//g' "$W/h.log" | head -4

          IP=$(python3 -c "import socket;print(socket.gethostbyname('$HOST'))" 2>/dev/null || echo "")
          echo
          echo "### bore --to $IP (ip literal)"
          if [ -n "$IP" ]; then
            "$BIN" local 3389 --to "$IP" >"$W/i.log" 2>&1 &
            P=$!; sleep 12
            if kill -0 $P 2>/dev/null; then echo "RESULT ip: STILL RUNNING (OK)"; kill $P 2>/dev/null; else echo "RESULT ip: DIED"; fi
            sed 's/\x1b\[[0-9;]*m//g' "$W/i.log" | head -4
          fi