name: TEST ssh-protocol e2e

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OS image'
        required: true
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 8
    steps:
      - name: 📜 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Remote Access (protocol=ssh)
        id: access
        uses: ./.github/actions/setup-rdp
        with:
          username: RDP
          custom_password: ''
          firewall_rule: RDP-SSHTEST
          protocol: ssh

      - name: 🔗 Install & Run Ngrok
        id: tunnel
        uses: ./.github/actions/setup-ngrok
        with:
          port: ${{ steps.access.outputs.port }}
          token: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: ✅ Verify Connectivity
        shell: bash
        env:
          PORT: ${{ steps.access.outputs.port }}
        run: |
          echo "🔍 Verifikasi port ${PORT}..."
          python3 -c "import socket,sys; s=socket.socket(); s.settimeout(8); sys.exit(0 if s.connect_ex(('127.0.0.1', int(sys.argv[1]))) == 0 else 1)" "$PORT" \
            && echo "LISTENING_OK port=${PORT}" \
            || { echo "NOT_LISTENING port=${PORT}"; exit 1; }

      - name: 📋 Display Access Info
        shell: bash
        env:
          PROTOCOL: ${{ steps.access.outputs.protocol }}
          PORT: ${{ steps.access.outputs.port }}
          PUBLIC_URL: ${{ steps.tunnel.outputs.public_url }}
          SSH_KEY: ${{ steps.access.outputs.ssh_private_key }}
        run: |
          echo ""
          echo "🎯 === SSH ACCESS INFO (TEST) === 🎯"
          echo "💻 Computer: ${PUBLIC_URL}"
          echo "🔌 Protocol: ${PROTOCOL}  Port: ${PORT}"
          echo "🎧 SSH banner:"
          python3 -c "import socket,sys; s=socket.socket(); s.settimeout(10); s.connect((sys.argv[1].split(':')[0], int(sys.argv[1].split(':')[1]))); print(s.recv(128).decode(errors='replace').strip())" "$PUBLIC_URL" || echo "(banner read gagal)"
          echo "🔑 Key fingerprint:"
          printf '%s\n' "$SSH_KEY" > /tmp/k.pem
          ssh-keygen -lf /tmp/k.pem 2>&1 | head -1
          echo "✅ SSH_E2E_OK"