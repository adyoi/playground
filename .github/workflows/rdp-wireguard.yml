name: Playground RDP (WireGuard)

on:
  workflow_dispatch:
    inputs:
      custom_password:
        description: 'Custom RDP password (optional, auto-generated if empty)'
        required: false
        type: string
      os:
        description: 'Runner OS image'
        required: true
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        default: 'windows-latest'
      wg_server_endpoint:
        description: 'WireGuard server endpoint (host:port, e.g. vpn.example.com:51820)'
        required: true
        type: string
      wg_server_tunnel_ip:
        description: 'Tunnel IP of your WireGuard server (e.g. 10.0.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: ${{ github.event.inputs.os }}
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 📋 Display Configuration Info
        run: |
          Write-Host "🔧 === PLAYGROUND RDP - WIREGUARD === 🔧"
          Write-Host "📦 Repository: ${{ github.repository }}"
          Write-Host "🆔 Run ID: ${{ github.run_id }}"
          Write-Host "👤 Triggered by: ${{ github.actor }}"
          Write-Host "🖥️ WG endpoint: ${{ github.event.inputs.wg_server_endpoint }}"
          Write-Host "===================================="

      - name: ⚙️ Configure Core RDP Settings
        run: |
          Write-Host "🔧 Mengaktifkan RDP & Firewall..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "AllowRemoteRPC" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-WireGuard" 2>nul
          netsh advfirewall firewall add rule name="RDP-WireGuard" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP & Firewall configured"

      - name: 👤 Create RDP User
        id: create-user
        run: |
          Write-Host "👤 Creating RDP user..."
          $customPass = "${{ github.event.inputs.custom_password }}"
          if ($customPass -ne "") {
            $password = $customPass
          } else {
            Add-Type -AssemblyName System.Security
            $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57); Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)) }
            $rawPassword = @()
            $rawPassword += $charSet.Upper | Get-Random -Count 4
            $rawPassword += $charSet.Lower | Get-Random -Count 4
            $rawPassword += $charSet.Number | Get-Random -Count 4
            $rawPassword += $charSet.Special | Get-Random -Count 4
            $password = -join ($rawPassword | Sort-Object { Get-Random })
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -Force
          }
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_OUTPUT
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            Write-Error "❌ User creation failed"
            exit 1
          }
          Write-Host "✅ RDP user created with secure password"

      - name: 🔌 Install WireGuard
        run: |
          Write-Host "🔌 Installing WireGuard for Windows..."
          $wgExe = "$env:ProgramFiles\WireGuard\wireguard.exe"
          if (Test-Path $wgExe) {
            Write-Host "✅ WireGuard already installed."
          } else {
            $installer = "$env:TEMP\wireguard-installer.exe"
            Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-installer.exe" -OutFile $installer
            Write-Host "   Running installer (silent)..."
            $proc = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
            Write-Host "   Installer exit code: $($proc.ExitCode)"
          }
          # WireGuard for Windows butuh winget-style PATH; pastikan wireguard.exe ada.
          $found = Get-ChildItem -Path "$env:ProgramFiles\WireGuard" -Filter "wireguard.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            Write-Error "❌ wireguard.exe not found after install."
            exit 1
          }
          Write-Host "✅ wireguard.exe: $($found.FullName)"
          echo "WG_EXE=$($found.FullName)" >> $env:GITHUB_ENV

      - name: 🔗 Establish WireGuard Tunnel
        env:
          WG_SERVER_ENDPOINT: ${{ github.event.inputs.wg_server_endpoint }}
          WG_SERVER_TUNNEL_IP: ${{ github.event.inputs.wg_server_tunnel_ip }}
          WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_CLIENT_TUNNEL_IP: ${{ vars.WG_CLIENT_TUNNEL_IP || '10.0.0.2/32' }}
        run: |
          if (-not $env:WG_CLIENT_PRIVATE_KEY) {
            Write-Error "❌ secret WG_CLIENT_PRIVATE_KEY belum diisi."
            Write-Host "   Buat keypair di PC Anda:  wg genkey | tee privatekey | wg pubkey < privatekey"
            Write-Host "   Public key-nya daftarkan sebagai peer di server WireGuard Anda,"
            Write-Host "   private key-nya simpan sebagai secret WG_CLIENT_PRIVATE_KEY."
            exit 1
          }
          if (-not $env:WG_SERVER_PUBLIC_KEY) {
            Write-Error "❌ secret WG_SERVER_PUBLIC_KEY belum diisi (public key server WireGuard Anda)."
            exit 1
          }

          $confDir = "$env:ProgramFiles\WireGuard\Data\Configurations"
          if (-not (Test-Path $confDir)) { New-Item -ItemType Directory -Path $confDir -Force | Out-Null }
          $confPath = Join-Path $confDir "wg0.conf"

          @"
[Interface]
PrivateKey = $($env:WG_CLIENT_PRIVATE_KEY.Trim())
Address = $($env:WG_CLIENT_TUNNEL_IP)

[Peer]
PublicKey = $($env:WG_SERVER_PUBLIC_KEY.Trim())
Endpoint = $($env:WG_SERVER_ENDPOINT)
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
"@ | Set-Content -Path $confPath -Encoding ASCII

          Write-Host "🔗 Installing WireGuard tunnel (wg0)..."
          $uninstall = & $env:WG_EXE /uninstalltunnelservice wg0 2>&1
          $install = & $env:WG_EXE /installtunnelservice $confPath 2>&1
          Write-Host "   install output: $install"
          Start-Sleep -Seconds 5

          $svc = Get-Service -Name "WireGuardTunnel`$wg0" -ErrorAction SilentlyContinue
          if (-not $svc) {
            Write-Error "❌ WireGuard tunnel service was not created."
            Write-Host "   install said: $install"
            exit 1
          }
          if ($svc.Status -ne 'Running') { Start-Service -Name $svc.Name }
          Write-Host "✅ Tunnel service running: $($svc.Name)"

          # Tunggu sampai interface wg0 punya IP
          $tunnelIp = $null
          for ($i = 0; $i -lt 24; $i++) {
            $addr = Get-NetIPAddress -InterfaceAlias "wg0" -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                    Where-Object { $_.IPAddress -notlike "169.254.*" } | Select-Object -First 1
            if ($addr) { $tunnelIp = $addr.IPAddress; break }
            Start-Sleep -Seconds 5
          }
          if (-not $tunnelIp) {
            Write-Host "📄 Tunnel status:"
            Get-Service -Name "WireGuardTunnel`$wg0" -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
            Write-Error "❌ Interface wg0 did not get an IP. Check server reachability + AllowedIPs."
            exit 1
          }
          Write-Host "✅ Tunnel IP: $tunnelIp"
          echo "WG_TUNNEL_IP=$tunnelIp" >> $env:GITHUB_ENV
          echo "WG_SERVER_TUNNEL_IP=$($env:WG_SERVER_TUNNEL_IP)" >> $env:GITHUB_ENV

      - name: ✅ Verify RDP Connectivity
        run: |
          Write-Host "🔍 Verifying RDP connectivity over WireGuard..."
          Write-Host "🌐 Server tunnel IP: $env:WG_SERVER_TUNNEL_IP"
          $ok = $false
          for ($i = 0; $i -lt 12; $i++) {
            $testResult = Test-NetConnection -ComputerName $env:WG_SERVER_TUNNEL_IP -Port 3389 -WarningAction SilentlyContinue
            if ($testResult.TcpTestSucceeded) { $ok = $true; break }
            Write-Host "   ... belum konek, retry $i"
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            Write-Error "❌ TCP connection to RDP port 3389 failed on $env:WG_SERVER_TUNNEL_IP"
            Write-Host "   Kalau TCP server OK tapi lewat tunnel tidak: cek AllowedIPs di peer server."
            exit 1
          }
          Write-Host "✅ TCP connectivity successful over WireGuard!"

      - name: 📋 Display RDP Access Info
        run: |
          Write-Host "`n🎯 === RDP ACCESS INFO (WIREGUARD) === 🎯"
          Write-Host "💻 Computer: $env:WG_SERVER_TUNNEL_IP"
          Write-Host "👤 Username: RDP"
          Write-Host "🔑 Password: ${{ steps.create-user.outputs.RDP_PASSWORD }}"
          Write-Host "==============================="
          Write-Host "📱 Cara Menyambung dari Devices Anda:"
          Write-Host "1️⃣ Pastikan PC Anda join WireGuard network yang sama"
          Write-Host "2️⃣ Buka Remote Desktop Connection (mstsc)"
          Write-Host "3️⃣ Masukkan Computer: $env:WG_SERVER_TUNNEL_IP"
          Write-Host "4️⃣ Masukkan user: RDP | pass: $(${{ steps.create-user.outputs.RDP_PASSWORD }})"
          Write-Host "=====================================`n"
          Write-Host "ℹ️ Alur: PC Anda = server WireGuard (endpoint publik), runner GitHub = client tunnel."
          Write-Host "   RDP session ini实际上 dari PC Anda lewat runner — atau lewat server WG langsung."

          $totalMinutes = 340
          for ($i = 0; $i -lt $totalMinutes; $i++) {
            Write-Host "🟢 [$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active via WireGuard"
            Start-Sleep -Seconds 60
          }

      - name: 🧹 Cleanup on Cancel/Failure
        if: cancelled() || failure()
        run: |
          Write-Host "🧹 Cleaning up WireGuard tunnel..."
          $wgExe = "$env:ProgramFiles\WireGuard\wireguard.exe"
          if (Test-Path $wgExe) {
            try { & $wgExe /uninstalltunnelservice wg0 2>&1 | Out-String | Write-Host } catch {}
          }
          $svc = Get-Service -Name "WireGuardTunnel`$wg0" -ErrorAction SilentlyContinue
          if ($svc) {
            try { Stop-Service -Name $svc.Name -Force -ErrorAction Stop } catch {}
            Write-Host "✅ WireGuard tunnel service stopped"
          } else {
            Write-Host "ℹ️ No WireGuard tunnel service found."
          }
          Write-Host "✅ Cleanup completed"
