name: 'Setup WireGuard Tunnel'
description: >-
  Bring up a WireGuard interface on the runner and peer with a hub you control (bring-your-own-server).
  Prints the runner public key so you can add it as a peer on the hub.

inputs:
  hub_public_key:
    description: 'WireGuard public key of your hub server'
    required: true
  hub_endpoint:
    description: 'Hub server endpoint, e.g. vpn.example.com:51820'
    required: true
  tunnel_address:
    description: 'Address assigned to this runner inside the tunnel, e.g. 10.8.0.2/32'
    required: true
  hub_address:
    description: 'Address of the hub inside the tunnel (AllowedIPs), e.g. 10.8.0.1/32'
    required: true
  preshared_key:
    description: 'Optional pre-shared key for extra post-quantum hardening'
    required: false
    default: ''

outputs:
  public_key:
    description: 'WireGuard public key of this runner - add it as a peer on your hub'
    value: ${{ steps.vpn.outputs.public_key }}

runs:
  using: composite
  steps:
    - id: vpn
      shell: bash
      env:
        WG_HUB_PUBLIC_KEY: ${{ inputs.hub_public_key }}
        WG_HUB_ENDPOINT: ${{ inputs.hub_endpoint }}
        WG_TUNNEL_ADDRESS: ${{ inputs.tunnel_address }}
        WG_HUB_ADDRESS: ${{ inputs.hub_address }}
        WG_PRESHARED_KEY: ${{ inputs.preshared_key }}
      run: |
        set -uo pipefail

        if [ -z "$WG_HUB_PUBLIC_KEY" ] || [ -z "$WG_HUB_ENDPOINT" ]; then
          echo "❌ hub_public_key dan hub_endpoint wajib diisi." >&2
          exit 1
        fi

        # wireguard.exe is driven with /switch arguments (e.g. /installtunnels).
        # Git Bash would rewrite those into Windows paths, so disable the conversion.
        export MSYS_NO_PATHCONV=1

        resolve_wg() {
          for candidate in "/c/Program Files/WireGuard/wireguard.exe" /usr/bin/wg /usr/local/bin/wg; do
            [ -x "$candidate" ] && { printf '%s' "$candidate"; return 0; }
          done
          command -v wg 2>/dev/null && return 0
          return 1
        }

        case "${RUNNER_OS}" in
          Linux)
            echo "🔐 Installing wireguard-tools (Linux)..."
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq
            sudo apt-get install -y -qq wireguard-tools iproute2
            ;;
          macOS)
            echo "🔐 Installing wireguard-tools (macOS)..."
            brew install wireguard-tools
            ;;
          Windows)
            echo "🔐 Installing WireGuard (Windows)..."
            WG_INSTALLER="$RUNNER_TEMP/wireguard-installer.exe"
            curl -fsSL -o "$WG_INSTALLER" "https://download.wireguard.com/windows-client/wireguard-installer.exe"
            powershell -NoProfile -Command "Start-Process -FilePath '$WG_INSTALLER' -ArgumentList '/S' -Wait" >/dev/null
            rm -f "$WG_INSTALLER"
            ;;
          *) echo "❌ Unsupported RUNNER_OS: $RUNNER_OS" >&2; exit 1 ;;
        esac

        WG="$(resolve_wg)" || { echo "❌ Binary wireguard tidak ditemukan setelah install" >&2; exit 1; }
        echo "📍 wireguard CLI: $WG"

        PRIVATE_KEY="$("$WG" genkey)"
        PUBLIC_KEY="$("$WG" pubkey <<< "$PRIVATE_KEY")"
        echo "🔑 Runner public key: ${PUBLIC_KEY}"

        CONFIG_DIR="/tmp/playground-wg"
        mkdir -p "$CONFIG_DIR"
        CONFIG="$CONFIG_DIR/wg0.conf"
        {
          echo "[Interface]"
          echo "PrivateKey = ${PRIVATE_KEY}"
          echo "Address = ${WG_TUNNEL_ADDRESS}"
          echo "MTU = 1420"
          echo ""
          echo "[Peer]"
          echo "PublicKey = ${WG_HUB_PUBLIC_KEY}"
          [ -n "$WG_PRESHARED_KEY" ] && echo "PresharedKey = ${WG_PRESHARED_KEY}"
          echo "Endpoint = ${WG_HUB_ENDPOINT}"
          echo "AllowedIPs = ${WG_HUB_ADDRESS}"
          echo "PersistentKeepalive = 25"
        } > "$CONFIG"

        case "${RUNNER_OS}" in
          Linux)
            sudo mkdir -p /etc/wireguard
            sudo cp "$CONFIG" /etc/wireguard/wg0.conf
            sudo chmod 600 /etc/wireguard/wg0.conf
            sudo wg-quick down wg0 >/dev/null 2>&1 || true
            sudo wg-quick up wg0
            ;;
          macOS)
            sudo mkdir -p /usr/local/etc/wireguard
            sudo cp "$CONFIG" /usr/local/etc/wireguard/wg0.conf
            sudo chmod 600 /usr/local/etc/wireguard/wg0.conf
            sudo wg-quick down wg0 >/dev/null 2>&1 || true
            sudo wg-quick up wg0
            ;;
          Windows)
            # Convert the POSIX path to a native one for the Windows client.
            WIN_CONFIG="$(cygpath -w "$CONFIG")"
            "$WG" /installtunnels "$WIN_CONFIG"
            ;;
        esac

        sleep 5
        "$WG" show 2>/dev/null || true

        # Handshake may legitimately take a few seconds; only fail if the interface is absent.
        if ! "$WG" show wg0 >/dev/null 2>&1; then
          echo "❌ Interface wg0 tidak aktif setelah setup." >&2
          echo "   Periksa AllowedIPs di hub, firewall UDP, dan PublicKey yang dicocokkan." >&2
          exit 1
        fi

        echo "public_key=${PUBLIC_KEY}" >> "$GITHUB_OUTPUT"
        echo "✅ WireGuard aktif (${WG_TUNNEL_ADDRESS})"