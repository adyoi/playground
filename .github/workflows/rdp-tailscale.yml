name: Playground RDP (Tailscale)

on:
  workflow_dispatch:
    inputs:
      custom_password:
        description: 'Custom RDP password (optional, auto-generated if empty)'
        required: false
        type: string

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 📋 Display Configuration Info
        run: |
          Write-Host "=== PLAYGROUND RDP - TAILSCALE ==="
          Write-Host "Repository: ${{ github.repository }}"
          Write-Host "Run ID: ${{ github.run_id }}"
          Write-Host "Triggered by: ${{ github.actor }}"
          Write-Host "==================================="

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "AllowRemoteRPC" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>nul
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        id: create-user
        run: |
          $customPass = "${{ github.event.inputs.custom_password }}"
          if ($customPass -ne "") {
            $password = $customPass
          } else {
            Add-Type -AssemblyName System.Security
            $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57); Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)) }
            $rawPassword = @()
            $rawPassword += $charSet.Upper | Get-Random -Count 4
            $rawPassword += $charSet.Lower | Get-Random -Count 4
            $rawPassword += $charSet.Number | Get-Random -Count 4
            $rawPassword += $charSet.Special | Get-Random -Count 4
            $password = -join ($rawPassword | Sort-Object { Get-Random })
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -Force
          }
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_OUTPUT
          if (-not (Get-LocalUser -Name "RDP")) {
            Write-Error "User creation failed"
            exit 1
          }

      - name: Install Tailscale
        run: |
          Write-Host "Menginstal Tailscale via official installer..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installerPath = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process $installerPath -ArgumentList "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Error "TAILSCALE_AUTH_KEY tidak ditemukan di GitHub Secrets."
            exit 1
          }

          $tailscalePath = "$env:ProgramFiles\Tailscale\Tailscale.exe"
          $service = Get-Service -Name Tailscale -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') {
            Write-Host "Starting Tailscale service..."
            Start-Service -Name Tailscale
            Start-Sleep -Seconds 5
          }

          Write-Host "=== Tailscale Status (Before) ==="
          & $tailscalePath status 2>&1
          Write-Host "=================================="

          Write-Host "Connecting to Tailscale..."
          $tsOutput = & $tailscalePath up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-routes 2>&1
          $tsExitCode = $LASTEXITCODE
          Write-Host "Tailscale up output:"
          Write-Host $tsOutput
          Write-Host "Exit code: $tsExitCode"
          if ($tsExitCode -ne 0) {
            Write-Error "Tailscale connection failed with exit code $tsExitCode"
            exit 1
          }

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
            $tsIP = & $tailscalePath ip -4
            if ($tsIP) { break }
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned after retries. Exiting."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

          Write-Host "=== Tailscale Status (After) ==="
          & $tailscalePath status 2>&1
          Write-Host "================================="

      - name: Verify RDP Connectivity
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed on $env:TAILSCALE_IP"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Display RDP Access Info
        run: |
          Write-Host "`n=== RDP ACCESS INFO (TAILSCALE) ==="
          Write-Host "Username: RDP"
          Write-Host "Password: ${{ steps.create-user.outputs.RDP_PASSWORD }}"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "===============================`n"
          Write-Host "Cara Menyambung Dari Laptop Anda:"
          Write-Host "1. Install Tailscale: https://tailscale.com/download"
          Write-Host "2. Login ke akun Tailscale yang sama (tailnet yang sama)"
          Write-Host "3. Tunggu status 'Connected' (hijau) di Tailscale app"
          Write-Host "4. Buka Remote Desktop Connection (mstsc)"
          Write-Host "5. Computer: $env:TAILSCALE_IP:3389"
          Write-Host "6. Username: RDP"
          Write-Host "7. Password: (lihat di atas)"
          Write-Host "`nCatatan:"
          Write-Host "- IP Tailscale format: 100.x.x.x (CGNAT range)"
          Write-Host "- Hanya bisa diakses dari device di tailnet yang sama"
          Write-Host "- Auth key mode Ephemeral: device auto-hapus saat disconnect"
          Write-Host "===============================`n"

          $totalMinutes = 355
          for ($i = 0; $i -lt $totalMinutes; $i++) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active via Tailscale ($env:TAILSCALE_IP)"
            Start-Sleep -Seconds 60
          }