name: 'Setup ZeroTier Mesh VPN'
description: 'Install ZeroTier on the current runner OS and join a network, returning the assigned managed address.'

inputs:
  network_id:
    description: 'ZeroTier network ID (16 hex characters) from my.zerotier.com'
    required: true

outputs:
  ip:
    description: 'ZeroTier managed IPv4 address of this runner'
    value: ${{ steps.vpn.outputs.ip }}

runs:
  using: composite
  steps:
    - id: vpn
      shell: bash
      env:
        ZEROTIER_NETWORK_ID: ${{ inputs.network_id }}
      run: |
        set -uo pipefail

        if [ -z "$ZEROTIER_NETWORK_ID" ]; then
          echo "❌ Network ID ZeroTier kosong." >&2
          exit 1
        fi

        # Since ZeroTier 1.14 the Windows installer only ships the `.bat` wrapper in
        # Program Files (the real binary lives in ProgramData), so the .bat
        # candidates must be probed first -- looking only for .exe fails silently.
        resolve_cli() {
          for candidate in \
            "/c/Program Files (x86)/ZeroTier/One/zerotier-cli.bat" \
            "/c/Program Files/ZeroTier/One/zerotier-cli.bat" \
            "/c/Program Files (x86)/ZeroTier/One/zerotier-cli.exe" \
            "/c/Program Files/ZeroTier/One/zerotier-cli.exe" \
            "/Library/Application Support/ZeroTier/One/zerotier-cli" \
            "/var/lib/zerotier-one/zerotier-cli"; do
            [ -f "$candidate" ] && { printf '%s' "$candidate"; return 0; }
          done
          command -v zerotier-cli 2>/dev/null && return 0
          return 1
        }

        case "${RUNNER_OS}" in
          Windows)
            echo "🪟 Installing ZeroTier (Windows)..."
            MSI="$RUNNER_TEMP/zerotier.msi"
            # /dist/ is the stable "latest" path; the versioned RELEASES/ path
            # (ZeroTier_Networks_x64.msi) returns 404 and must not be used.
            curl -fsSL -o "$MSI" "https://download.zerotier.com/dist/ZeroTierOne.msi" || {
              echo "❌ Gagal mengunduh installer ZeroTier" >&2; exit 1; }
            powershell -NoProfile -Command "Start-Process msiexec -ArgumentList '/i','$MSI','/qn','/norestart' -Wait" >/dev/null
            rm -f "$MSI"
            ;;
          Linux|macOS)
            echo "🪐 Installing ZeroTier ($RUNNER_OS)..."
            # Must be bash, NOT sh: the install script uses bash-only constructs
            # (declare -A associative arrays, [[ ]]), which on Ubuntu are dash
            # and fail with "declare: not found" and a syntax error at the
            # distro-detection step.
            if ! curl -fsSL https://install.zerotier.com | sudo bash; then
              echo "❌ Install script ZeroTier gagal" >&2
              echo "   Domestic fallback: https://install.zerotier.com/?os=linux" >&2
              exit 1
            fi
            ;;
          *) echo "❌ Unsupported RUNNER_OS: $RUNNER_OS" >&2; exit 1 ;;
        esac

        ZT="$(resolve_cli)" || {
          echo "❌ Binary zerotier-cli tidak ditemukan setelah install." >&2
          echo "   Cari manual:" >&2
          echo "   Windows: 'C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat'" >&2
          echo "   Linux:   /var/lib/zerotier-one/zerotier-cli" >&2
          exit 1
        }
        echo "📍 zerotier-cli: $ZT"

        # `sudo` does not exist in Git Bash on the Windows runners, and it is not
        # needed there (the job already runs as Administrator). Linux/macOS do need
        # it because the zerotier-one service drops privileges.
        SUDO=""
        [ "${RUNNER_OS}" != "Windows" ] && SUDO="sudo"

        echo "🔗 Joining network ${ZEROTIER_NETWORK_ID}..."
        $SUDO "$ZT" join "$ZEROTIER_NETWORK_ID" 2>&1 | tee "$RUNNER_TEMP/zt-join.log" || true

        dump_state() {
          echo "---- zerotier-cli info ----" >&2
          $SUDO "$ZT" info 2>&1 | head -n 30 >&2 || true
          echo "---- zerotier-cli listnetworks ----" >&2
          $SUDO "$ZT" listnetworks 2>&1 | head -n 60 >&2 || true
          echo "---------------------------" >&2
        }

        # Dependency-free IP parsing (no python/jq needed): read the text form of
        # `zerotier-cli listnetworks`, keep the line whose network ID matches and
        # take the first real IPv4/prefix after it. ZeroTier prints 999.x.x.x as a
        # placeholder while the node is still unauthorized, so that one is skipped.
        parse_ip() {
          $SUDO "$ZT" listnetworks 2>/dev/null | tr -d '\r' | while read -r line; do
            set -- $line
            [ "${1:-}" = "200" ] || continue
            [ "${2:-}" = "listnetworks" ] || continue
            [ "${3:-}" = "$ZEROTIER_NETWORK_ID" ] || continue
            shift 3
            for token in "$@"; do
              case "$token" in
                */*)
                  addr="${token%%/*}"
                  case "$addr" in
                    999.*|''|*[!0-9.]*) continue ;;
                  esac
                  printf '%s' "$addr"
                  return 0
                  ;;
              esac
            done
          done
        }

        # Network Private -> node runner harus di-authorize dulu dari dashboard
        # ZeroTier, jadi ID node dicetak dan window tunggu dibuat lebar (10 menit)
        # supaya masih ada waktu untuk klik "Auth" sambil step ini berjalan.
        NODE_ID="$($SUDO "$ZT" info 2>/dev/null | tr -d '\r' | awk 'NR==1 {print $3}')"
        [ -n "$NODE_ID" ] || NODE_ID='(tidak terbaca)'

        ATTEMPTS=120          # 120 x 5s = 10 menit
        WAIT_SECONDS=$((ATTEMPTS * 5))

        echo "⏳ Menunggu IP ZeroTier (maks $((WAIT_SECONDS / 60)) menit)..."
        echo "   Node ID runner : ${NODE_ID}"
        echo "   Network Private? Authorize node di atas di:"
        echo "   https://my.zerotier.com -> Networks -> ${ZEROTIER_NETWORK_ID} -> Members -> centang 'Auth'"

        ZT_IP=""
        for i in $(seq 1 "$ATTEMPTS"); do
          ZT_IP="$(parse_ip)"
          [ -n "$ZT_IP" ] && break
          if [ $((i % 12)) -eq 0 ]; then
            echo "   ... menunggu $((i * 5))s/${WAIT_SECONDS}s (node ${NODE_ID})"
          fi
          sleep 5
        done

        if [ -z "$ZT_IP" ]; then
          echo "" >&2
          dump_state
          echo "❌ Node belum dapat IP ZeroTier setelah $((WAIT_SECONDS / 60)) menit." >&2
          echo "   Penyebab paling umum: network Access type = Private, node belum di-authorize." >&2
          echo "   1. Buka https://my.zerotier.com -> Networks -> ${ZEROTIER_NETWORK_ID} -> Members" >&2
          echo "   2. Cari node ${NODE_ID}, centang 'Auth'" >&2
          echo "   3. Jalankan ulang workflow ini" >&2
          exit 1
        fi

        echo "ip=${ZT_IP}" >> "$GITHUB_OUTPUT"
        echo "🌐 ZeroTier IP: ${ZT_IP}"